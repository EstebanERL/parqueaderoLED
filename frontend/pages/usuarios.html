<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios · Parqueadero</title>
<link rel="stylesheet" href="../css/styles.css">
</head><body>
<div id="nav"></div>
<div class="container">
  <h1>Gestión de usuarios</h1>
  <div id="msg"></div>
  <div class="card" style="max-width:520px;margin-bottom:24px">
    <h2>Crear usuario</h2>
    <form id="f">
      <div class="row">
        <div><label>Nombre</label><input id="nombre" required></div>
        <div><label>Email</label><input id="email" type="email" required></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>Contraseña</label><input id="password" type="password" required minlength="6"></div>
        <div><label>Rol</label>
          <select id="rol"><option value="operario">operario</option><option value="administrador">administrador</option></select>
        </div>
      </div>
      <button class="btn" style="margin-top:14px" type="submit">Crear</button>
    </form>
  </div>
  <div class="card" style="padding:0;overflow:auto">
    <table><thead><tr>
      <th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Creado</th><th></th>
    </tr></thead><tbody id="tbl"></tbody></table>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
requireAuth('administrador'); renderNav('usuarios');

async function cargar() {
  const rows = await api('/usuarios');
  document.getElementById('tbl').innerHTML = rows.map(u => `
    <tr>
      <td>${u.nombre}</td><td>${u.email}</td><td>${u.rol}</td>
      <td>${u.activo ? '✅ activo' : '⛔ inactivo'}</td>
      <td>${fmtDate(u.creado_en)}</td>
      <td>${u.activo ? `<button class="btn danger" data-id="${u.id}">Desactivar</button>` : ''}</td>
    </tr>`).join('');
  document.querySelectorAll('button[data-id]').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('¿Desactivar este usuario?')) return;
      await api('/usuarios/' + b.dataset.id, { method: 'DELETE' });
      cargar();
    });
  });
}
cargar();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/usuarios', { method: 'POST', body: {
      nombre: document.getElementById('nombre').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      rol: document.getElementById('rol').value,
    }});
    document.getElementById('f').reset();
    document.getElementById('msg').innerHTML = '<div class="success">Usuario creado</div>';
    cargar();
  } catch (err) {
    document.getElementById('msg').innerHTML = `<div class="error">${err.message}</div>`;
  }
});
</script>
</body></html>
