<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Parqueadero</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head><body>
<div id="nav"></div>
<div class="container">
  <div class="page-head">
    <div>
      <h1>Panel de control</h1>
      <p class="lead">Resumen en tiempo real de cupos disponibles y vehículos dentro.</p>
    </div>
    <div style="display:flex;gap:10px">
      <a class="btn ghost" href="historial.html"><i class="fas fa-clock-rotate-left"></i> Historial</a>
      <a class="btn" href="entrada.html"><i class="fas fa-plus"></i> Nueva entrada</a>
    </div>
  </div>

  <div class="grid" id="cupos"></div>

  <div style="margin-top:28px" class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px">
      <h2 style="margin:0"><i class="fas fa-car-side" style="color:var(--primary)"></i> Vehículos dentro ahora</h2>
      <span class="badge"><i class="fas fa-arrows-rotate"></i> Actualiza cada 15s</span>
    </div>
    <div style="overflow:auto;margin:0 -24px -24px;border-radius:0 0 var(--radius) var(--radius)">
    <table><thead><tr>
      <th>Placa</th><th>Tipo</th><th>Espacio</th><th>Entrada</th><th></th>
    </tr></thead><tbody id="tblActivos"><tr><td colspan="5">Cargando…</td></tr></tbody></table>
    </div>
  </div>
</div>
<a class="whatsapp-fab" href="https://wa.me/573000000000?text=Hola,%20necesito%20ayuda%20con%20el%20parqueadero"
   target="_blank" rel="noopener" title="Soporte por WhatsApp"><i class="fab fa-whatsapp"></i></a>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
requireAuth();
renderNav('dashboard');

async function cargar() {
  const [cupos, activos] = await Promise.all([api('/api/cupos'), api('/api/registros/activos')]);
  document.getElementById('cupos').innerHTML = cupos.map((c, idx) => {
    const tone = c.disponibles > 0 ? 'green' : 'amber';
    const isAuto = c.categoria === 'auto';
    return `
    <div class="stat ${tone}">
      <div class="icon"><i class="fas ${isAuto?'fa-car':'fa-motorcycle'}"></i></div>
      <div class="label">${isAuto ? 'Autos disponibles' : 'Motos disponibles'}</div>
      <div class="value">${c.disponibles}<span style="color:var(--muted);font-size:1rem;font-weight:500"> / ${c.capacidad}</span></div>
    </div>`;
  }).join('') + `
    <div class="stat violet">
      <div class="icon"><i class="fas fa-car-side"></i></div>
      <div class="label">Dentro ahora</div>
      <div class="value">${activos.length}</div>
    </div>`;

  const tb = document.getElementById('tblActivos');
  tb.innerHTML = activos.length ? activos.map(a => `
    <tr>
      <td><strong style="font-family:'Space Grotesk',sans-serif;letter-spacing:.05em">${a.placa}</strong></td>
      <td><span class="badge ${a.categoria}">${a.tipo}</span></td>
      <td>${a.espacio || '—'}</td>
      <td style="color:var(--text-soft)">${fmtDate(a.hora_entrada)}</td>
      <td><a class="btn success sm" href="salida.html?placa=${a.placa}"><i class="fas fa-right-from-bracket"></i> Salida</a></td>
    </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px"><i class="fas fa-inbox" style="font-size:1.5rem;display:block;margin-bottom:8px;opacity:.4"></i>No hay vehículos dentro</td></tr>';
}
cargar().catch(e => alert(e.message));
setInterval(cargar, 15000);
</script>
</body></html>
