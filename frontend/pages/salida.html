<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salida · Parqueadero</title>
<link rel="stylesheet" href="../css/styles.css">
</head><body>
<div id="nav"></div>
<div class="container">
  <h1>Registrar salida</h1>
  <div class="card" style="max-width:520px">
    <div id="msg"></div>
    <div style="margin-bottom:14px">
      <label>Buscar por placa</label>
      <div style="display:flex;gap:8px">
        <input id="placa" maxlength="10" style="text-transform:uppercase" placeholder="ABC123">
        <button class="btn" id="btnBuscar">Buscar</button>
      </div>
    </div>
    <div id="resultado"></div>
  </div>
  <div id="ticketBox"></div>
</div>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
requireAuth();
renderNav('salida');

const params = new URLSearchParams(location.search);
if (params.get('placa')) {
  document.getElementById('placa').value = params.get('placa');
  setTimeout(buscar, 200);
}

document.getElementById('btnBuscar').addEventListener('click', buscar);

async function buscar() {
  const placa = document.getElementById('placa').value.toUpperCase().trim();
  const res = document.getElementById('resultado');
  res.innerHTML = '';
  document.getElementById('msg').innerHTML = '';
  if (!placa) return;
  try {
    const r = await api('/registros/placa/' + encodeURIComponent(placa));
    res.innerHTML = `
      <div class="card" style="background:#f8fafc;margin-top:8px">
        <p><b>Placa:</b> ${r.placa} — <b>Tipo:</b> ${r.tipo}</p>
        <p><b>Entrada:</b> ${fmtDate(r.hora_entrada)}</p>
        <label>Descuento (opcional)</label>
        <input id="desc" type="number" min="0" value="0" style="margin-bottom:12px">
        <button class="btn danger" id="btnSalida">Confirmar salida y generar ticket</button>
      </div>`;
    document.getElementById('btnSalida').addEventListener('click', () => salida(r.id));
  } catch (e) {
    document.getElementById('msg').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

async function salida(id) {
  try {
    const descuento = Number(document.getElementById('desc').value || 0);
    const { ticket } = await api('/registros/salida/' + id, {
      method: 'POST', body: { descuento }
    });
    document.getElementById('resultado').innerHTML = '';
    document.getElementById('ticketBox').innerHTML = renderTicket(ticket);
  } catch (e) {
    document.getElementById('msg').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

function renderTicket(t) {
  return `
    <div class="ticket" id="ticket">
      <h3>🅿️ TICKET DE PAGO</h3>
      <div class="line"><span>Código:</span><span>${t.codigo}</span></div>
      <div class="line"><span>Placa:</span><b>${t.placa}</b></div>
      <div class="line"><span>Entrada:</span><span>${fmtDate(t.hora_entrada)}</span></div>
      <div class="line"><span>Salida:</span><span>${fmtDate(t.hora_salida)}</span></div>
      <div class="line"><span>Tiempo:</span><span>${t.minutos_total} min</span></div>
      <div class="line"><span>Subtotal:</span><span>${money(t.valor_bruto)}</span></div>
      ${t.descuento > 0 ? `<div class="line"><span>Descuento:</span><span>-${money(t.descuento)}</span></div>` : ''}
      <div class="line total"><span>TOTAL:</span><span>${money(t.total)}</span></div>
    </div>
    <div style="text-align:center">
      <button class="btn" onclick="window.print()">🖨️ Imprimir ticket</button>
    </div>`;
}
</script>
</body></html>
