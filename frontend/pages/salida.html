<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salida · Parqueadero</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css">
</head><body>
<div id="nav"></div>
<div class="container">
  <div class="page-head">
    <div>
      <h1><i class="fas fa-right-from-bracket" style="color:var(--danger)"></i> Registrar salida</h1>
      <p class="lead">Busca la placa, aplica descuento si corresponde y genera el ticket de pago.</p>
    </div>
  </div>
  <div class="card" style="max-width:620px">
    <div id="msg"></div>
    <label><i class="fas fa-magnifying-glass"></i> Buscar por placa</label>



    <div style="display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap">
  <input id="placa" maxlength="10"
    style="text-transform:uppercase;letter-spacing:.15em;font-weight:700;text-align:center"
    placeholder="ABC123">

  <button class="btn" id="btnBuscar">
    <i class="fas fa-search"></i> Buscar
  </button>

  <button class="btn success" onclick="document.getElementById('qrInput').click()">
    <i class="fas fa-qrcode"></i> Escanear QR
  </button>

  <input type="file" id="qrInput" accept="image/*" style="display:none">
</div>


    <div id="resultado"></div>
  </div>
  <div id="ticketBox"></div>
</div>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.min.js"></script>
<script>
requireAuth();
renderNav('salida');

const params = new URLSearchParams(location.search);
if (params.get('placa')) {
  document.getElementById('placa').value = params.get('placa');
  setTimeout(buscar, 200);
}

document.getElementById('btnBuscar').addEventListener('click', buscar);

async function buscar() {
  const placa = document.getElementById('placa').value.toUpperCase().trim();
  const res = document.getElementById('resultado');
  res.innerHTML = '';
  document.getElementById('msg').innerHTML = '';
  if (!placa) return;
  try {
    const r = await api('/registros/placa/' + encodeURIComponent(placa));
    res.innerHTML = `
      <div style="background:var(--surface-soft);margin-top:18px;padding:20px;border-radius:14px;border:1px dashed var(--border-strong)">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px">
          <div><span style="color:var(--muted);font-size:.8rem">Placa</span><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:.05em">${r.placa}</div></div>
          <div><span style="color:var(--muted);font-size:.8rem">Tipo</span><div style="font-weight:600">${r.tipo}</div></div>
          <div><span style="color:var(--muted);font-size:.8rem">Entrada</span><div style="font-weight:600">${fmtDate(r.hora_entrada)}</div></div>
        </div>
        <hr style="border:none;border-top:1px dashed var(--border-strong);margin:14px 0">
        <label>Descuento (valor fijo)</label>
        <input id="desc" type="number" min="0" value="0" style="margin-bottom:14px">
        <button class="btn danger" id="btnSalida" style="width:100%;padding:13px"><i class="fas fa-receipt"></i> Confirmar salida y generar ticket</button>
      </div>`;
    document.getElementById('btnSalida').addEventListener('click', () => salida(r.id));
  } catch (e) {
    document.getElementById('msg').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

async function salida(id) {
  try {
    const descuento = Number(document.getElementById('desc').value || 0);
    const { ticket } = await api('/registros/salida/' + id, {
      method: 'POST', body: { descuento }
    });
    document.getElementById('resultado').innerHTML = '';
    document.getElementById('ticketBox').innerHTML = renderTicket(ticket);
  } catch (e) {
    document.getElementById('msg').innerHTML = `<div class="error">${e.message}</div>`;
  }
}

function renderTicket(t) {
  const qrData = JSON.stringify({
    placa: t.placa,
    codigo: t.codigo
  });

  setTimeout(() => {
    const canvas = document.getElementById('qrCanvas');
    if (canvas) {
      QRCode.toCanvas(canvas, qrData, {
        width: 180,
        margin: 2
      });
    }
  }, 100);

  return `
    <div class="ticket" id="ticket">
      <h3>🅿️ TICKET DE PAGO</h3>

      <div class="line"><span>Código:</span><span>${t.codigo}</span></div>
      <div class="line"><span>Placa:</span><b>${t.placa}</b></div>
      <div class="line"><span>Entrada:</span><span>${fmtDate(t.hora_entrada)}</span></div>
      <div class="line"><span>Salida:</span><span>${fmtDate(t.hora_salida)}</span></div>
      <div class="line"><span>Tiempo:</span><span>${t.minutos_total} min</span></div>
      <div class="line"><span>Subtotal:</span><span>${money(t.valor_bruto)}</span></div>
      ${t.descuento > 0 ? `<div class="line"><span>Descuento:</span><span>-${money(t.descuento)}</span></div>` : ''}
      <div class="line total"><span>TOTAL:</span><span>${money(t.total)}</span></div>

      <div style="text-align:center;margin-top:20px">
        <canvas id="qrCanvas"></canvas>
        <p style="font-size:.8rem;color:gray">Escanea para buscar vehículo</p>
      </div>
    </div>

    <div style="text-align:center">
      <button class="btn" onclick="window.print()">
        <i class="fas fa-print"></i> Imprimir ticket
      </button>
    </div>
  `;
}

document.getElementById('qrInput').addEventListener('change', async function (e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();
  const loadPromise = new Promise((resolve, reject) => {
    img.onload = () => resolve();
    img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
    img.src = url;
  });

  try {
    await loadPromise;
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (!code) throw new Error('No se detectó un QR válido');

    const data = JSON.parse(code.data);
    if (!data.placa) throw new Error('QR no contiene placa');

    document.getElementById('placa').value = data.placa;
    buscar();
  } catch (err) {
    alert(err.message || 'QR inválido');
  }
});


</script>
</body></html>
